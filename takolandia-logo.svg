<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="200" height="160">
  <defs>
    <style>
      .takolandia-text { font-family: Arial, sans-serif; font-weight: bold; text-anchor: middle; }
      .takolandia-main { font-size: 36px; fill: #3D1B5C; }
      .takolandia-sub { font-size: 16px; fill: #E91E63; }
    </style>
  </defs>
  
  <!-- Yellow background -->
  <circle cx="150" cy="80" r="75" fill="#FFD700"/>
  
  <!-- Sombrero (Sombrero Mexicano) -->
  <!-- Ala del sombrero -->
  <ellipse cx="150" cy="65" rx="85" ry="20" fill="#3D1B5C"/>
  <ellipse cx="150" cy="63" rx="80" ry="18" fill="#4A2970"/>
  
  <!-- Banda roja del sombrero -->
  <ellipse cx="150" cy="65" rx="75" ry="8" fill="#E91E63"/>
  <path d="M 75 65 Q 150 70 225 65" stroke="#E91E63" stroke-width="6" fill="none" opacity="0.7"/>
  
  <!-- Detalles del sombrero -->
  <circle cx="120" cy="62" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="135" cy="60" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="150" cy="59" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="165" cy="60" r="3" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="180" cy="62" r="3" fill="#FFFFFF" opacity="0.8"/>
  
  <!-- Triangles on sombrero -->
  <polygon points="130,67 135,74 125,74" fill="#FFFFFF"/>
  <polygon points="150,68 155,75 145,75" fill="#FFFFFF"/>
  <polygon points="170,67 175,74 165,74" fill="#FFFFFF"/>
  
  <!-- Cara -->
  <!-- Cabeza -->
  <circle cx="150" cy="110" r="50" fill="#3D1B5C"/>
  <circle cx="150" cy="115" r="48" fill="#4A2970"/>
  
  <!-- Ojos -->
  <circle cx="130" cy="95" r="6" fill="#FFFFFF"/>
  <circle cx="170" cy="95" r="6" fill="#FFFFFF"/>
  <circle cx="130" cy="96" r="3" fill="#3D1B5C"/>
  <circle cx="170" cy="96" r="3" fill="#3D1B5C"/>
  
  <!-- Bigote -->
  <path d="M 150 110 Q 130 105 115 110" stroke="#3D1B5C" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 150 110 Q 170 105 185 110" stroke="#3D1B5C" stroke-width="4" fill="none" stroke-linecap="round"/>
  
  <!-- Boca sonriente -->
  <path d="M 130 125 Q 150 140 170 125" stroke="#E91E63" stroke-width="3" fill="none" stroke-linecap="round"/>
  
  <!-- Nariz -->
  <ellipse cx="150" cy="115" rx="3" ry="5" fill="#3D1B5C"/>
  
  <!-- Texto TAKOLANDIA -->
  <text x="150" y="195" class="takolandia-text takolandia-main">TAKOLANDIA</text>
  
  <!-- Texto COMIDA MEXICANA -->
  <text x="150" y="225" class="takolandia-text takolandia-sub">COMIDA MEXICANA</text>
</svg>